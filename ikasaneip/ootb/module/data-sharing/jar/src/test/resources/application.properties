module.name=data-sharing

# standard dirs
persistence.dir=./persistence
lib.dir=./lib

# Logging levels across packages (optional)
logging.level.root=ERROR
logging.level.com.arjuna=ERROR
logging.level.org.springframework=ERROR
logging.level.org.ikasan=ERROR
logging.level.liquibase=ERROR

# Blue console servlet settings (optional)
server.error.whitelabel.enabled=false

# Web Bindings
server.port=8080
server.address=localhost
server.servlet.context-path=/data-sharing
server.tomcat.additional-tld-skip-patterns=xercesImpl.jar,xml-apis.jar,serializer.jar,mchange-commons-java-0.2.15.jar
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jms.activemq.ActiveMQAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,me.snowdrop.boot.narayana.autoconfigure.NarayanaConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,,org.ikasan.backup.IkasanBackupAutoConfiguration

spring.liquibase.change-log=classpath:db-changelog.xml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false
spring.liquibase.show-summary=off
spring.liquibase.show-summary-output=log

# Ikasan persistence store
datasource.username=sa
datasource.password=sa
datasource.driver-class-name=org.h2.Driver
datasource.xadriver-class-name=org.h2.jdbcx.JdbcDataSource
datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
datasource.dialect=org.hibernate.dialect.H2Dialect
datasource.show-sql=false
datasource.hbm2ddl.auto=none
datasource.validationQuery=select 1

big.queue.consumer.inboundQueueName=module-inbound-context-queue
big.queue.consumer.outboundQueueName=module-outbound-context-queue
big.queue.consumer.queueDir=./target/queueDir

ikasan.exceptions.retry-configs.[0].className=org.ikasan.spec.component.endpoint.EndpointException
ikasan.exceptions.retry-configs.[0].delayInMillis=5000
ikasan.exceptions.retry-configs.[0].maxRetries=-1

ikasan.exceptions.stopClasses[0]=java.lang.RuntimeException

ikasan.default.transaction.timeout.seconds=300

# Data Sharing Configuration
# Upstream dashboard configuration (where data is fetched from)
data-sharing.upstreamDashboard=http://localhost:9080/ikasan-dashboard
data-sharing.upstreamDashboardUsername=admin
data-sharing.upstreamDashboardPassword=admin

# Downstream dashboard configurations (where data is pushed to)
# Format: data-sharing.downStreamDashboards[dashboard-name]=url
data-sharing.downStreamDashboards[DASHBOARD_1\ Ikasan\ ESB\ Dashboard]=http://localhost:9081
data-sharing.downStreamDashboards[DASHBOARD_2\ Ikasan\ ESB\ Dashboard]=http://localhost:9082

# Downstream dashboard usernames
data-sharing.downStreamDashboardUsernames[DASHBOARD_1\ Ikasan\ ESB\ Dashboard]=admin
data-sharing.downStreamDashboardUsernames[DASHBOARD_2\ Ikasan\ ESB\ Dashboard]=admin

# Downstream dashboard passwords
data-sharing.downStreamDashboardPasswords[DASHBOARD_1\ Ikasan\ ESB\ Dashboard]=admin
data-sharing.downStreamDashboardPasswords[DASHBOARD_2\ Ikasan\ ESB\ Dashboard]=admin

# Entities to share with each downstream dashboard (comma-separated)
# Supported entities: WIRETAP, ERROR, EXCLUSION, REPLAY, MODULE, CONFIGURATION
data-sharing.downStreamDashboardEntities[DASHBOARD_1\ Ikasan\ ESB\ Dashboard]=WIRETAP,ERROR,EXCLUSION
data-sharing.downStreamDashboardEntities[DASHBOARD_2\ Ikasan\ ESB\ Dashboard]=WIRETAP,ERROR

data-sharing.downStreamDashboardEntityCronExpressions[DASHBOARD_1\ Ikasan\ ESB\ Dashboard-WIRETAP]=*/10 * * * * ?
data-sharing.downStreamDashboardEntityCronExpressions[DASHBOARD_2\ Ikasan\ ESB\ Dashboard-WIRETAP]=*/10 * * * * ?

# Modules to filter for each downstream dashboard (comma-separated)
# Empty means all modules
data-sharing.downStreamDashboardModules[DASHBOARD_1\ Ikasan\ ESB\ Dashboard]=module1,module2
data-sharing.downStreamDashboardModules[DASHBOARD_2\ Ikasan\ ESB\ Dashboard]=

# Flow definitions for data sharing flows
data-sharing.flowDefinitions[DASHBOARD_1\ Ikasan\ ESB\ Dashboard]=MANUAL
data-sharing.flowDefinitions[DASHBOARD_2\ Ikasan\ ESB\ Dashboard]=MANUAL

